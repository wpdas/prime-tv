<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>PrimeTV · Player</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#C4B5FD}a:hover{color:#DDD6FE}
</style>
</helmet>
<div style="width: 1280px; height: 720px; box-sizing: border-box; background: #000000; color: #F2F2F2; font-family: Inter, system-ui, sans-serif; position: relative; overflow: hidden">

<div role="img" aria-label="Vídeo em reprodução" style="position: absolute; inset: 0; background: #151226">
<div style="position: absolute; width: 520px; height: 520px; border-radius: 50%; background: #1F1A38; right: 120px; top: -80px"></div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 260px; background: #0E0C19"></div>
<div style="position: absolute; left: 760px; bottom: 260px; width: 34px; height: 210px; background: #2E2558"></div>
<div style="position: absolute; left: 748px; bottom: 466px; width: 58px; height: 28px; border-radius: 4px; background: #C4B5FD"></div>
</div>

<div style="position: absolute; left: 0; right: 0; top: 0; padding: 28px 48px; display: flex; align-items: center; gap: 16px; background: rgba(11,11,15,0.72)">
<a href="Detalhes.dc.html" aria-label="Voltar" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #F2F2F2">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<div>
<div style="font-size: 20px; font-weight: 700">O Último Farol</div>
<div style="font-size: 15px; color: #D4D4DC">T1:E4 · A tripulação</div>
</div>
<span style="margin-left: auto; font-size: 13px; color: #D4D4DC; border: 1px solid #55555F; border-radius: 4px; padding: 3px 7px">1080p · Dublado</span>
</div>

<div style="position: absolute; right: 48px; bottom: 170px; width: 300px; background: #16161C; border-radius: 10px; padding: 14px; display: flex; gap: 12px; align-items: center">
<div style="width: 96px; height: 54px; border-radius: 6px; background: #33243A; flex-shrink: 0"></div>
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; color: #A1A1AD">Próximo episódio em 8 s</span>
<span style="font-size: 15px; font-weight: 600">E5 · Neblina</span>
</div>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 48px 30px; background: rgba(11,11,15,0.82); display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; gap: 16px; font-size: 14px; color: #D4D4DC">
<span>32:40</span>
<div style="flex: 1; height: 6px; border-radius: 3px; background: #3A3A46; position: relative">
<div style="position: absolute; left: 0; top: 0; bottom: 0; width: 59%; border-radius: 3px; background: #8B5CF6"></div>
<div style="position: absolute; left: 59%; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; background: #F2F2F2"></div>
</div>
<span>55:10</span>
</div>
<div style="display: flex; align-items: center; gap: 10px">
<button aria-label="Voltar 10 segundos" style="width: 52px; height: 52px; border-radius: 26px; border: 0; background: transparent; color: #F2F2F2; display: flex; align-items: center; justify-content: center">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path></svg></button>
<button aria-label="Pausar" style="width: 60px; height: 60px; border-radius: 30px; border: 0; background: #F2F2F2; color: #0B0B0F; display: flex; align-items: center; justify-content: center; outline: 3px solid #8B5CF6; outline-offset: 3px">
<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg></button>
<button aria-label="Avançar 10 segundos" style="width: 52px; height: 52px; border-radius: 26px; border: 0; background: transparent; color: #F2F2F2; display: flex; align-items: center; justify-content: center">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"></path><path d="M21 3v5h-5"></path></svg></button>
<div style="margin-left: auto; display: flex; gap: 8px">
<sc-for list="{{opts}}" as="o" hint-placeholder-count="4">
<button style="height: 44px; padding: 0 16px; border-radius: 8px; border: 0; background: #22222A; color: #F2F2F2; font-family: inherit; font-size: 15px; font-weight: 500">{{o}}</button>
</sc-for>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    return { opts: ['Áudio', 'Legendas', 'Episódios', 'Próximo episódio'] };
  }
}
</script>
</body>
</html>
