name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: APK assinado + GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restaurar keystore e segredos
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Secret KEYSTORE_BASE64 ausente"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/primetv.jks"
          cat > keystore.properties <<PROPS
          storeFile=$RUNNER_TEMP/primetv.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
          echo "TMDB_API_KEY=$TMDB_API_KEY" > local.properties

      - name: Testes unitários
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build release
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Renomear APK
        id: apk
        run: |
          VERSION="${GITHUB_REF_NAME}"
          OUT="primetv-${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          sha256sum "$OUT" > "$OUT.sha256"

      - name: Notas da release a partir do CHANGELOG.md
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Copia a seção "## [X.Y.Z]" (até a próxima seção "## ") para o corpo da release.
          awk -v v="$VERSION" '
            /^## \[/ { if (found) exit; found = index($0, "[" v "]") > 0; next }
            found { print }
          ' CHANGELOG.md | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Sem seção [$VERSION] no CHANGELOG.md; usando notas geradas pelo GitHub." >&2
            echo "generated=true" >> "$GITHUB_OUTPUT"
          else
            echo "generated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          name: PrimeTV ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.generated == 'false' && 'release-notes.md' || '' }}
          generate_release_notes: ${{ steps.notes.outputs.generated == 'true' }}
          files: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.file }}.sha256
